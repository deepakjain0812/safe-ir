name: SAFE-IR evidence collection
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect synthetic evidence and run Maven tests
        run: bash collect_evidence.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safe-ir-supplement
          path: |
            safe-ir-supplement/
            safe-ir-supplement.zip
          if-no-files-found: warn
