name: Research audit
on:
  push:
    branches: [main, research-osaudit, research-evidence-docs]
    paths:
      - 'SAFE-IR_Preprint.pdf'
      - 'docs/publications/safe-ir.pdf'
      - 'osaudit.toml'
      - 'research-audit/**'
      - '.github/workflows/research-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  audit:
    concurrency:
      group: research-audit-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Initialize audit diagnostics
        run: |
          mkdir -p research-audit/inputs research-audit/results
          git rev-parse HEAD > research-audit/audit.log
          python --version >> research-audit/audit.log
          cmp SAFE-IR_Preprint.pdf docs/publications/safe-ir.pdf
          sha256sum SAFE-IR_Preprint.pdf docs/publications/safe-ir.pdf | tee research-audit/pdf-checksums.txt >> research-audit/audit.log
      - name: Install official auditor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install osaudit==0.7.0
          python -m pip show osaudit
      - name: Retrieve original immutable evidence
        run: |
          mkdir -p research-audit/inputs research-audit/results
          curl --fail --location --retry 3 https://github.com/deepakjain0812/safe-ir/releases/download/v0.1.0/safe-ir-supplement.zip -o research-audit/inputs/safe-ir-supplement.zip
          echo '15784e565a8eb26b2892c7937129c7660b115a31f85d11b42ab99dea898278f7  research-audit/inputs/safe-ir-supplement.zip' | sha256sum -c -
      - name: Publish original raw evidence
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath
          with zipfile.ZipFile("research-audit/inputs/safe-ir-supplement.zip") as z:
              for n in z.namelist():
                  p = PurePosixPath(n)
                  if n.endswith("/") or p.parts[0] != "safe-ir-supplement" or ".." in p.parts:
                      continue
                  dest = Path("research-audit/inputs/original").joinpath(*p.parts[1:])
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(n))
          PY
      - name: Record original policy structure
        run: |
          git show bfb0f5a89c212634c268e2e42adbe85cb07190c8:src/main/java/org/safeir/policy/EcraPolicyEngine.java > research-audit/inputs/original-policy.java
          osaudit run --input research-audit/inputs/original-policy.java -o research-audit/results/policy-structure.json -- python research-audit/measure_policy.py
      - name: Extract historical results with new provenance
        run: |
          osaudit run --input research-audit/inputs/safe-ir-supplement.zip -o research-audit/results/historical.json -- python research-audit/extract_evidence.py research-audit/inputs/safe-ir-supplement.zip
      - name: Restore exact archived live experiment files
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dest=research-audit/inputs/live-20261119
          if [ ! -f "$dest/MANIFEST.sha256" ]; then
            gh api repos/${{ github.repository }}/actions/artifacts/14539544665/zip > /tmp/safe-ir-live-original.zip
            echo 'ebbd67da6850fb90bec7895f43c04866b5cb36aa6945528a21cbe50c3ff7e788  /tmp/safe-ir-live-original.zip' | sha256sum -c -
            python - <<'PY'
          import json, zipfile
          from pathlib import Path
          dest = Path("research-audit/inputs/live-20261119")
          names = {"expanded_replay.json", "model-details.txt", "models.txt", "version.txt", "one_model_replay.json", "review-accounting.json", "ollama-docker.log"}
          with zipfile.ZipFile("/tmp/safe-ir-live-original.zip") as z:
              for name in sorted(names):
                  matches = [p for p in z.namelist() if Path(p).name == name]
                  assert len(matches) == 1, (name, matches)
                  raw = z.read(matches[0])
                  if name == "expanded_replay.json":
                      assert json.loads(raw) == json.loads((dest / name).read_bytes()), "Original and transcription differ"
                  (dest / name).write_bytes(raw)
          PY
            (cd "$dest" && sha256sum expanded_replay.json model-details.txt models.txt version.txt one_model_replay.json review-accounting.json ollama-docker.log > MANIFEST.sha256)
          fi
          (cd "$dest" && sha256sum -c MANIFEST.sha256)
      - name: Aggregate archived live-model evidence
        run: |
          osaudit run --input research-audit/inputs/live-20261119/expanded_replay.json -o research-audit/results/live-20261119.json -- python research-audit/aggregate_live.py
      - name: Run official audit
        run: |
          set +e
          osaudit numbers --json > research-audit/number-findings.json
          number_status=$?
          osaudit 2>&1 | tee -a research-audit/audit.log
          status=${PIPESTATUS[0]}
          if [ "$number_status" -eq 2 ]; then exit 2; fi
          exit "$status"
      - name: Preserve exact live evidence on main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-audit/inputs/live-20261119/
          if ! git diff --cached --quiet; then
            git commit -m "Archive verified original live experiment files"
            git push origin HEAD:main
          fi
      - name: Preserve verified evidence in Git
        if: success() && github.ref == 'refs/heads/research-evidence-docs'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-audit/inputs/original research-audit/inputs/original-policy.java research-audit/results/ research-audit/number-findings.json research-audit/audit.log
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified historical audit evidence"
            git push origin HEAD:research-evidence-docs
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: research-audit
          path: |
            research-audit/results/
            research-audit/number-findings.json
            research-audit/audit.log
            research-audit/pdf-checksums.txt
