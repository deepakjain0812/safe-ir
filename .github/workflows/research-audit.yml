name: Research audit
on:
  push:
    branches: [research-osaudit]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Initialize audit diagnostics
        run: |
          mkdir -p research-audit/inputs research-audit/results
          git rev-parse HEAD > research-audit/audit.log
          python --version >> research-audit/audit.log
      - name: Install official auditor
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install osaudit==0.7.0
          python -m pip show osaudit
      - name: Retrieve original immutable evidence
        run: |
          mkdir -p research-audit/inputs research-audit/results
          curl --fail --location --retry 3 https://github.com/deepakjain0812/safe-ir/releases/download/v0.1.0/safe-ir-supplement.zip -o research-audit/inputs/safe-ir-supplement.zip
          echo '15784e565a8eb26b2892c7937129c7660b115a31f85d11b42ab99dea898278f7  research-audit/inputs/safe-ir-supplement.zip' | sha256sum -c -
      - name: Extract historical results with new provenance
        run: |
          osaudit run --input research-audit/inputs/safe-ir-supplement.zip -o research-audit/results/historical.json -- python research-audit/extract_evidence.py research-audit/inputs/safe-ir-supplement.zip
      - name: Run official audit
        run: |
          set +e
          osaudit numbers --json > research-audit/number-findings.json
          number_status=$?
          osaudit 2>&1 | tee -a research-audit/audit.log
          status=${PIPESTATUS[0]}
          if [ "$number_status" -eq 2 ]; then exit 2; fi
          exit "$status"
      - name: Preserve verified evidence in Git
        if: success() && github.ref == 'refs/heads/research-osaudit'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research-audit/inputs/safe-ir-supplement.zip research-audit/results/historical.json research-audit/number-findings.json research-audit/audit.log
          if ! git diff --cached --quiet; then
            git commit -m "Preserve verified historical audit evidence"
            git push origin HEAD:research-osaudit
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: research-audit
          path: |
            research-audit/results/
            research-audit/number-findings.json
            research-audit/audit.log
